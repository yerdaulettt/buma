services:
  s3:
    image: chrislusf/seaweedfs
    container_name: s3
    ports:
      - "8334:8333"
      - "12536:12535"
    env_file:
      - .env
    volumes:
      - "s3data:/data"

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.9-alpine3.23
    container_name: db
    ports:
      - "5433:5432"
    volumes:
      - "dbdata:/var/lib/postgresql/data"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 3
      timeout: 10s
      start_period: 30s

volumes:
  s3data:
  dbdata: